# Pinned variant aligned with the current seamless1 Python and Dask stack.
name: seamless1-exact
channels:
  - conda-forge
dependencies:
  - python=3.14.4
  - aiofiles
  - dask=2026.3.0
  - distributed=2026.3.0
  - pyyaml
  - jsonschema
  - ipython=9.13.0
  - numpy=2.4.4
  - bokeh
  - pip
  - pip:
      - orjson
      - pylint
      - frozendict
      - dask_jobqueue
      - pydoc-markdown
      - mkdocs
      - mkdocs-material
      - mkdocstrings[python]
      - -e ../seamless-core
      - -e ../remote-http-launcher
      - -e ../seamless-config
      - -e ../seamless-remote
      - -e ../seamless-transformer[compiled]
      - -e ../seamless-jobserver
      - -e ../seamless-dask
      - -e ../seamless-database
      - -e ../hashserver
      - -e ../seamless-signature
      - -e ../seamless-workflow
      - .
# The regular local install above places the Conda activation hook in the environment.
