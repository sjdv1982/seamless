name: seamless1
channels:
  - conda-forge
dependencies:
  - aiofiles
  - dask
  - distributed
  - pyyaml
  - jsonschema
  - ipython=9.13.*
  - numpy
  - bokeh
  - pip
  - pip:
      - orjson
      - pylint
      - frozendict
      - dask_jobqueue
      - pydoc-markdown
      - mkdocs
      - mkdocs-material
      - mkdocstrings[python]
      - -e ../seamless-core
      - -e ../remote-http-launcher
      - -e ../seamless-config
      - -e ../seamless-remote
      - -e ../seamless-transformer[compiled]
      - -e ../seamless-jobserver
      - -e ../seamless-dask
      - -e ../seamless-database
      - -e ../hashserver
      - -e ../seamless-signature
      - -e ../seamless-workflow
      - .
# The regular local install above places the Conda activation hook in the environment.
