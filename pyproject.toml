[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seamless-suite"
version = "1.5a"
description = "Seamless umbrella distribution (all components by default)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [{name = "Sjoerd de Vries"}]
dependencies = [
    "seamless-core>=0.2.1",
    "seamless-config>=0.3.3",
    "seamless-remote>=0.6.0",
    "seamless-transformer[compiled]>=0.8.0",
    "seamless-dask>=0.6.0",
    "seamless-jobserver>=0.5",
    "seamless-database>=2.3.0",
    "hashserver>=1.1.0",
    "remote-http-launcher>=0.4.5",
    "seamless-signature>=0.1.2",
    "seamless-workflow>=0.2.0"
]
keywords = ["seamless", "suite", "workflow", "reproducibility", "caching", "pipeline", "HPC", "deterministic", "content-addressed"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/sjdv1982/seamless"
Repository = "https://github.com/sjdv1982/seamless"
Issues = "https://github.com/sjdv1982/seamless/issues"

[tool.setuptools]
packages = []

[tool.setuptools.data-files]
"etc/conda/activate.d" = ["conda/activate.d/seamless-mode-bind.sh"]
